<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoteWords</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div>
                <p class="brand">NOTEWORDS</p>
                <h1>A place for words.</h1>
            </div>

            <button class="following">
                Following⌄
            </button>

        </header>


        <!-- TODAY'S THOUGHT -->
        <div class="today">
            Today's quiet thought · September 23
        </div>


        <!-- WORD FEED -->
        <main class="feed">

            <!-- FIRST NOTE -->
            <article class="note-card">

                <div class="note-top">

                    <div class="author">

                        <div class="avatar avatar-green"></div>

                        <div>
                            <h3>Mara Ellison</h3>
                            <p>8 minutes ago</p>
                        </div>

                    </div>

                    <button class="menu">☰</button>

                </div>


                <div class="small-line green-line"></div>


                <p class="note-text">
                    You do not have to bloom on someone else's calendar.
                    Some seasons are for becoming roots.
                </p>


                <div class="note-actions">

                    <div>
                        <button>♡ <span>24</span></button>
                        <button>Reply</button>
                    </div>

                    <button class="save">♧</button>

                </div>

            </article>


            <!-- SECOND NOTE -->
            <article class="note-card">

                <div class="note-top">

                    <div class="author">

                        <div class="avatar avatar-brown"></div>

                        <div>
                            <h3>Jonah Reed</h3>
                            <p>Yesterday</p>
                        </div>

                    </div>

                    <button class="menu">☰</button>

                </div>


                <div class="small-line brown-line"></div>


                <p class="note-text">
                    A gentle life is not a small life.
                </p>


                <div class="note-actions">

                    <div>
                        <button>♡ <span>11</span></button>
                        <button>Reply</button>
                    </div>

                    <button class="save">♧</button>

                </div>

            </article>

        </main>


        <!-- WRITE BUTTON -->
        <button class="write-button">
            <span>＋</span>
            Write
        </button>


        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">

            <a href="index.html" class="nav-item active">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </a>

          <a href="saved.html" class="nav-item">
    <span class="nav-icon">♧</span>
    <span>Saved</span>
</a>
            <a href="profile.html" class="nav-item">

        </nav>

    </div>


    <script src="script.js"></script>

</body>
</html>
