<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile · NoteWords</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="profile-header">

            <div class="profile-avatar">
                Y
            </div>

            <h1>You</h1>

            <p class="profile-username">
                @yourwords
            </p>

            <p class="profile-bio">
                Writing what matters, one note at a time.
            </p>

        </header>


        <section class="profile-stats">

            <div>
                <strong id="noteCount">0</strong>
                <span>Notes</span>
            </div>

            <div>
                <strong id="savedCount">0</strong>
                <span>Saved</span>
            </div>

            <div>
                <strong>0</strong>
                <span>Likes</span>
            </div>

        </section>


        <main class="profile-content">

            <p class="profile-section-title">
                YOUR WORDS
            </p>

            <div id="profileNotes" class="feed">
                <!-- Your notes will appear here -->
            </div>

        </main>


        <nav class="bottom-nav">

            <a href="index.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </a>

            <a href="saved.html" class="nav-item">
                <span class="nav-icon">♧</span>
                <span>Saved</span>
            </a>

            <a href="profile.html" class="nav-item active">
                <span class="nav-icon">♙</span>
                <span>Profile</span>
            </a>

        </nav>

    </div>


    <script src="script.js"></script>

</body>

</html>
